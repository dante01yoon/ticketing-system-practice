apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: ticketing-app:ch11
          imagePullPolicy: Never
          command: ["python", "-m", "backend.app.seed", "--if-empty"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://ticketing:$(DB_PASSWORD)@postgres:5432/ticketing
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
