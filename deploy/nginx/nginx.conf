worker_processes auto;
events { worker_connections 1024; }

http {
  # 사용자별 속도 제한 키: X-User-Id, 없으면 클라이언트 IP
  map $http_x_user_id $rl_key {
    default $http_x_user_id;
    ""      $binary_remote_addr;
  }
  limit_req_zone $rl_key zone=per_user:10m rate=5r/s;
  limit_req_status 429;

  # 앱은 compose 가 고정 IP(172.31.77.11~13)를 준다. 이름 풀이(resolve)를 쓰지 않는 이유:
  # resolve 는 DNS 결과가 바뀔 때(앱 정지 → Host not found) upstream 구성 세대를 올리는데,
  # 그 순간 재시도 중이던 요청은 'no live upstreams'(502)가 된다. IP 리터럴이면 nginx 는 앱이 멈춰 있어도 시작되고
  # (이름 풀이 실패 없음), 멈춘 앱은 connect timeout 뒤 max_fails/fail_timeout 으로 빠지고 같은 IP로 돌아오면 다시 들어온다.
  upstream apps {
    zone apps 64k;          # 워커 간 공유 상태 → 라운드 로빈이 워커 수와 무관하게 고르다
    server 172.31.77.11:8000 max_fails=1 fail_timeout=10s;
    server 172.31.77.12:8000 max_fails=1 fail_timeout=10s;
    server 172.31.77.13:8000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 8080;

    limit_req zone=per_user burst=10 nodelay;
    error_page 429 = @rate_limited;

    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;
      # non_idempotent 를 넣지 않는다: 앱에 이미 전달된 POST 는 다른 앱으로 재전송하지 않는다.
      # (연결 실패로 아직 전달되지 않은 POST 는 nginx 기본 동작대로 다음 앱으로 갈 수 있다.)
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 뒤 다시 시도하세요."}';
    }
  }
}
