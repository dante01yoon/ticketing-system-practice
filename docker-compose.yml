services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["events"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  app1:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    networks:
      default:
        ipv4_address: 172.31.77.11
    environment:
      APP_ID: app1
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@db:5432/ticketing
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BATCH: ${QUEUE_BATCH:-100}
      QUEUE_INTERVAL_SECONDS: ${QUEUE_INTERVAL_SECONDS:-10}
      ENTRY_TTL_SECONDS: ${ENTRY_TTL_SECONDS:-120}
      ENTRY_TOKEN_SECRET: ${ENTRY_TOKEN_SECRET:-dev-entry-token-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  app2:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    networks:
      default:
        ipv4_address: 172.31.77.12
    environment:
      APP_ID: app2
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@db:5432/ticketing
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BATCH: ${QUEUE_BATCH:-100}
      QUEUE_INTERVAL_SECONDS: ${QUEUE_INTERVAL_SECONDS:-10}
      ENTRY_TTL_SECONDS: ${ENTRY_TTL_SECONDS:-120}
      ENTRY_TOKEN_SECRET: ${ENTRY_TOKEN_SECRET:-dev-entry-token-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  app3:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    networks:
      default:
        ipv4_address: 172.31.77.13
    environment:
      APP_ID: app3
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@db:5432/ticketing
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
      REDIS_URL: redis://redis:6379/0
      QUEUE_BATCH: ${QUEUE_BATCH:-100}
      QUEUE_INTERVAL_SECONDS: ${QUEUE_INTERVAL_SECONDS:-10}
      ENTRY_TTL_SECONDS: ${ENTRY_TTL_SECONDS:-120}
      ENTRY_TOKEN_SECRET: ${ENTRY_TOKEN_SECRET:-dev-entry-token-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.77.0/24

volumes:
  pgdata:
