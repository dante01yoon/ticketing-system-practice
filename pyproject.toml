[project]
name = "ticketing"
version = "0.1.0"
description = "콘서트 좌석 예매 시스템 실습 (FastAPI · PostgreSQL · Redis)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5",
    "confluent-kafka>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
